[platformio]
default_envs = esp32s3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall
lib_deps = bblanchon/ArduinoJson@7.2.1

[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps =
  bblanchon/ArduinoJson@7.2.1
  links2004/WebSockets@2.6.1
  knolleary/PubSubClient@2.8
  ESP32Async/AsyncTCP@3.3.2
  ESP32Async/ESPAsyncWebServer@3.6.0
test_ignore = *
